const fresh=()=>({lang:'en',tab:'home',tg:0,ham:0,myth:0,tc:0,emb:0,stable:0,barr:0,range:0,base:true,goal:0,cap:3,speed:0,help:0,queues:1,bd:0,bh:0,bm:0,ud:0,uh:0,um:0,window:0,active1:'',active2:'',remain1:0,remain2:0,prep:'',player:'',role:'general',f2p:false,extraTG:0,extraHam:0,bears:0,bearRate:0,feast:0,feastRate:0,fair:false,arena:false,p2:false,p3:false,p4:false,weekly:false,daily:0,topup:0,gear:[],class:'inf',done:{},spend:{},oration:0,scoreBudget:0,widgets:0,mithril:0,rare:0,epic:0,legend:0,adv:0,common:0});

const stage=s=>s===0?'30':s%5===0?'TG'+s/5:(s<5?'30':'TG'+Math.floor(s/5))+'-'+s%5;
const tier=t=>t?'TG'+t:'TC30';
const names=k=>({tc:T('Town Center','Centro urbano','Municipio',"Şehir Merkezi","مركز المدينة"),emb:T('Embassy','Embajada','Ambasciata',"Elçilik","السفارة"),stable:T('Stable','Establo','Scuderia',"Ahır","الإسطبل"),barr:T('Barracks','Cuartel','Caserma',"Kışla","الثكنة"),range:T('Range','Campo de tiro','Poligono',"Atış Alanı","ميدان الرماية")})[k];
const buildingKeys=['tc','emb','stable','barr','range'];
const costs={tc:[132,158,238,280,335],emb:[33,39,59,70,83],stable:[59,71,107,126,150],barr:[59,71,107,126,150],range:[59,71,107,126,150]},gates=[null,'stable','barr','range','stable'];

const hcost=(a,b)=>5*(b*(b+1)-a*(a+1)),mcum=m=>m>10?(m-10)*(m-9)/2:0,mcost=(a,b)=>mcum(b)-mcum(a);

function projections(){let ptg=I('tg')+I('extraTG'),pham=I('ham')+I('extraHam')+I('bears')*I('bearRate')+Math.min(7,I('feast'))*I('feastRate')+(S.fair?10:0)+(S.arena?5:0),cash=0,top=I('topup'),bags=0;for(const [id,t,c,p,b] of [['p2',30,4.99,2500,100],['p3',60,9.99,5000,160],['p4',100,19.99,10000,220],['weekly',20+12*Math.min(7,I('daily')),4.99,2500,0]])if(!S.f2p&&S[id]){ptg+=t;cash+=c;top+=p;bags+=b}return{ptg,pham,cash,top,bags}}

function plan(start,target,speed=0,help=0,queues=1,active={}){let a={...start},steps=[],blocks=[],total=0,base=0,work=0;const used=new Set();function up(k,to){let wm=0;while(a[k]<to){let before=a[k],t=Math.floor(before/5),bm=baseTime[k][t],paid=Object.hasOwn(active,k)&&!used.has(k);if(paid)used.add(k);let time=paid?active[k]:Math.max(0,bm/(1+speed/100)-help),cost=paid?0:costs[k][t];a[k]++;total+=cost;base+=bm;work+=time;wm+=time;steps.push({k,before,to:a[k],cost,bm,wm:time,paid})}return wm}while(a.tc<target*5){let t=Math.floor(a.tc/5),e=up('emb',t*5),g=gates[t]?up(gates[t],t*5):0;if(queues===2)blocks.push([e,g]);else blocks.push([e],[g]);blocks.push([up('tc',(t+1)*5)])}const elapsed=blocks.reduce((s,b)=>s+Math.max(...b),0);return{total,steps,base,work,elapsed,blocks,unused:Object.keys(active).filter(k=>!used.has(k))}}

function setValue(el){let k=el.dataset.k;if(el.type==='checkbox')S[k]=el.checked;else if(el.type==='number'||(el.tagName==='SELECT'&&['tc','emb','stable','barr','range','goal','cap','queues'].includes(k))){let v=num(el.value);if(el.type==='number'&&el.max!=='')v=Math.min(v,Number(el.max));S[k]=v}else S[k]=el.value;}
app.addEventListener('input',e=>{let el=e.target;if(el.dataset.k){if(el.tagName==='SELECT'||el.type==='checkbox')return;setValue(el);update()}else if(el.dataset.spend){S.spend[el.dataset.spend]=Math.floor(num(el.value));update()}else if(el.dataset.setname){let s=S.gear.find(s=>s.id===el.dataset.setname);if(s){s.name=el.value;update()}}});
app.addEventListener('change',e=>{let el=e.target;if(el.dataset.k){setValue(el);if(['lang','queues','f2p'].includes(el.dataset.k)){render();return}if(el.type==='number')el.value=S[el.dataset.k];update()}else if(el.dataset.gear){let [id,i,k]=el.dataset.gear.split(':'),x=S.gear.find(s=>s.id===id).pieces[Number(i)];x[k]=el.type==='checkbox'?el.checked:Number(el.value);if(x.to<x.from){x.to=x.from;let to=app.querySelector(`[data-gear="${id}:${i}:to"]`);if(to)to.value=x.to}update()}else if(el.dataset.done){S.done[el.dataset.done]=el.checked;update()}else if(el.dataset.spend){el.value=S.spend[el.dataset.spend]||0;update()}});
app.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){S.tab=el.dataset.tab;for(let sec of app.querySelectorAll('.tab'))sec.hidden=sec.id!==S.tab;for(let btn of app.querySelectorAll('nav [data-tab]'))btn.setAttribute('aria-selected',String(btn.dataset.tab===S.tab));save();return}if(el.dataset.class){S.class=el.dataset.class;for(let btn of app.querySelectorAll('[data-class]'))btn.setAttribute('aria-selected',String(btn.dataset.class===S.class));renderGear();update();return}if(el.id==='addSet'){S.gear.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:S.class,name:'',pieces:['helmet','gloves','chest','boots'].map(slot=>({slot,enabled:false,from:0,to:0}))});renderGear();update()}else if(el.dataset.remove){if(confirm(T('Remove this gear set?','¿Eliminar este set?','Rimuovere questo set?',"Bu ekipman seti silinsin mi?","هل تريد إزالة مجموعة المعدات هذه؟"))){S.gear=S.gear.filter(s=>s.id!==el.dataset.remove);renderGear();update()}}else if(el.id==='fillPoints'){if(!confirm(T('Replace all TG and hammer allocations with the current upgrade plan?','¿Reemplazar asignaciones de oro y martillos con el plan actual?','Sostituire allocazioni oro e martelli con il piano attuale?',"Tüm TG ve çekiç dağılımları mevcut yükseltme planıyla değiştirilsin mi?","هل تريد استبدال جميع تخصيصات TG والمطارق بخطة الترقيات الحالية؟")))return;let b=buildingResult(),g=gearTotals();if(b){for(let d of [1,2,5])S.spend['tg_'+d]=0;S.spend.tg_1=b.r.total}for(let d of [4,5])S.spend['ham_'+d]=0;S.spend.ham_4=g.h;for(let input of app.querySelectorAll('[data-spend]'))input.value=S.spend[input.dataset.spend]||0;update()}else if(el.id==='reset'){if(confirm(T('Erase all saved inventory, plans and checklists?','¿Borrar inventario, planes y listas guardados?','Cancellare scorte, piani e liste salvati?',"Kaydedilen tüm envanter, planlar ve kontrol listeleri silinsin mi?","هل تريد حذف جميع المخزونات والخطط وقوائم المتابعة المحفوظة؟"))){let lang=S.lang;S=fresh();S.lang=lang;render();text('notice',T('Reset complete.','Restablecido.','Azzerato.',"Sıfırlama tamamlandı.","تمت إعادة الضبط."))}}else if(el.id==='copy'){try{await navigator.clipboard.writeText($('summary').value);text('notice',T('Report copied.','Informe copiado.','Rapporto copiato.',"Rapor kopyalandı.","تم نسخ التقرير."))}catch{let t=$('summary');t.closest('details').open=true;t.select();text('notice',T('Select and copy manually.','Selecciona y copia manualmente.','Seleziona e copia manualmente.',"Elle seç ve kopyala.","حدد النص وانسخه يدويًا."))}}});
